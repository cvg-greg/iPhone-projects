<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENENGINE — Music Production Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
/* ============================================================
   GENENGINE — style.css — dark neon studio theme
   ============================================================ */
:root {
  --bg: #07090f;
  --panel: #11151d;
  --panel2: #171c26;
  --panel3: #1d232f;
  --line: #232a38;
  --text: #cfd8e3;
  --dim: #8b96a5;
  --acc: #22d3ee;
  --acc2: #e879f9;
  --good: #34d399;
  --warn: #f59e0b;
  --bad: #f87171;
  --pr-bg: #0b0e15;
  --pr-black: #0d1119;
  --pr-white: #121722;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "SF Pro Display", -apple-system, Roboto, sans-serif;
  font-size: 13px;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

#app { display: flex; flex-direction: column; height: 100vh; }

/* ================= topbar ================= */
#topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 8px 14px;
  background: linear-gradient(180deg, #141926, #0e1219);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.logo { line-height: 1; }
.logo-gen, .logo-engine { font-size: 21px; font-weight: 800; letter-spacing: 2px; }
.logo-gen {
  background: linear-gradient(90deg, var(--acc), #67e8f9);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.logo-engine {
  background: linear-gradient(90deg, #c084fc, var(--acc2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.logo-tag { font-size: 8.5px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; margin-top: 2px; }

.proj-name-wrap { border-left: 1px solid var(--line); padding-left: 14px; }
.proj-name {
  font-size: 14px; font-weight: 600; color: #e7edf5;
  padding: 4px 10px; border-radius: 6px; min-width: 90px;
  outline: none; border: 1px solid transparent; cursor: text;
}
.proj-name:hover, .proj-name:focus { border-color: var(--line); background: var(--panel); }

.transport { display: flex; align-items: center; gap: 8px; }
.tbtn {
  width: 42px; height: 36px; border-radius: 8px;
  background: var(--panel2); color: var(--text);
  border: 1px solid var(--line); font-size: 16px; cursor: pointer;
  transition: all .12s;
}
.tbtn:hover { background: var(--panel3); border-color: #33405a; }
.tbtn.play { width: 52px; font-size: 17px; }
.tbtn.play.playing {
  background: linear-gradient(135deg, rgba(34,211,238,.25), rgba(232,121,249,.2));
  border-color: var(--acc); color: #a5f3fc;
  box-shadow: 0 0 18px rgba(34,211,238,.35);
}
.tbtn.rec { color: #f87171; font-size: 13px; }
.tbtn.rec.armed { background: rgba(248,113,113,.18); border-color: var(--bad); box-shadow: 0 0 14px rgba(248,113,113,.4); animation: pulse 1.2s infinite; }
.tbtn.small { width: 34px; height: 32px; font-size: 13px; }
.tbtn.active { border-color: var(--acc); color: var(--acc); }
@keyframes pulse { 50% { opacity: .65; } }

.mode-seg { margin-left: 2px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg-btn {
  background: none; border: none; color: var(--dim); padding: 7px 12px;
  font-size: 11px; font-weight: 700; letter-spacing: 1px; cursor: pointer;
}
.seg-btn.active { background: linear-gradient(135deg, rgba(34,211,238,.22), rgba(232,121,249,.16)); color: #a5f3fc; }

.bpm-wrap { text-align: center; }
.bpm-val {
  font-family: "SF Mono", Consolas, monospace; font-size: 21px; font-weight: 700;
  color: #a5f3fc; cursor: ns-resize; padding: 0 8px;
  text-shadow: 0 0 12px rgba(34,211,238,.5);
}
.bpm-label { font-size: 7.5px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }

.pos-display {
  font-family: "SF Mono", Consolas, monospace; font-size: 16px; color: #d8b4fe;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; min-width: 92px; text-align: center;
}

.viz { border-radius: 8px; background: rgba(0,0,0,.35); border: 1px solid var(--line); }

.file-ops { display: flex; gap: 6px; margin-left: auto; align-items: center; }

/* ================= buttons ================= */
.btn {
  background: var(--panel2); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 13px; font-size: 12px; cursor: pointer; font-weight: 600;
  transition: all .12s;
}
.btn:hover { background: var(--panel3); }
.btn.glow {
  background: linear-gradient(135deg, rgba(34,211,238,.2), rgba(232,121,249,.18));
  border-color: rgba(34,211,238,.55); color: #a5f3fc;
}
.btn.glow:hover { box-shadow: 0 0 16px rgba(34,211,238,.35); }
.btn.subtle.active { border-color: var(--acc); color: var(--acc); }
.btn.big { display: block; width: 100%; margin: 8px 0; padding: 13px; font-size: 14px; }
.btn.danger-btn { border-color: rgba(248,113,113,.4); color: var(--bad); margin-top: 10px; }
.mini-btn {
  background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
  border-radius: 5px; min-width: 20px; height: 20px; font-size: 11px; cursor: pointer; padding: 0 5px;
}
.mini-btn:hover { color: var(--text); border-color: #33405a; }
.mini-btn.danger:hover { color: var(--bad); border-color: var(--bad); }
.mini-btn.play { color: var(--acc); }
.icon-btn { background: none; border: none; color: var(--dim); font-size: 15px; cursor: pointer; }
.icon-btn:hover { color: var(--text); }

.gsel {
  background: var(--panel2); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; font-size: 12px; max-width: 210px;
}
.ginput {
  background: var(--panel); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 12px; font-size: 14px; width: 100%; margin-bottom: 10px;
  outline: none;
}
.ginput:focus { border-color: var(--acc); }
.ginput.slim { width: 170px; margin: 0; padding: 6px 9px; font-size: 12px; }

.dim { color: var(--dim); font-size: 11px; letter-spacing: .5px; }
.small { font-size: 10.5px; line-height: 1.5; }
.pad-l { margin-left: 12px; }

/* ================= tabs ================= */
#tabs {
  display: flex; gap: 3px; padding: 6px 14px 0;
  background: #0c0f16; border-bottom: 1px solid var(--line);
}
.tab-btn {
  background: transparent; border: 1px solid transparent; border-bottom: none;
  color: var(--dim); padding: 9px 16px 10px; cursor: pointer;
  font-size: 12px; font-weight: 700; letter-spacing: .5px;
  border-radius: 9px 9px 0 0; position: relative;
}
.tab-btn:hover { color: var(--text); background: rgba(255,255,255,.03); }
.tab-btn.active {
  color: #a5f3fc; background: var(--panel);
  border-color: var(--line);
  box-shadow: inset 0 2px 0 var(--acc);
}
.tab-fkey { font-size: 8px; color: var(--dim); margin-left: 6px; opacity: .7; }
.kbd-toggle { margin-left: auto; }
.kbd-toggle.active { color: var(--acc2); }

#main { flex: 1; overflow: hidden; background: var(--panel); position: relative; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }

/* ================= channel rack ================= */
.view-steps { overflow: auto; }
.pat-bar {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-bottom: 1px solid var(--line); background: var(--panel2);
  position: sticky; top: 0; z-index: 5; flex-wrap: wrap;
}
.pat-label { font-size: 9px; color: var(--dim); letter-spacing: 2px; font-weight: 700; }
.pat-chips { display: flex; gap: 5px; flex-wrap: wrap; }
.pat-chip {
  display: flex; align-items: center; gap: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
  padding: 5px 10px; cursor: pointer; font-size: 12px; transition: all .12s;
}
.pat-chip:hover { border-color: hsl(var(--hue), 70%, 55%); }
.pat-chip.active {
  border-color: hsl(var(--hue), 85%, 60%);
  background: hsla(var(--hue), 70%, 50%, .16);
  box-shadow: 0 0 12px hsla(var(--hue), 80%, 60%, .25);
}
.pat-chip.queued { animation: pulse .7s infinite; border-color: var(--warn); }
.pat-chip-num {
  background: hsla(var(--hue), 80%, 55%, .25); color: hsl(var(--hue), 90%, 75%);
  font-weight: 800; font-size: 10px; border-radius: 4px; padding: 1px 5px;
}
.pat-add {
  background: var(--panel); border: 1px dashed var(--line); color: var(--dim);
  border-radius: 7px; padding: 5px 11px; cursor: pointer; font-size: 13px;
}
.pat-add:hover { color: var(--acc); border-color: var(--acc); }
.pat-len { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.pat-len-num { font-family: monospace; font-size: 14px; color: #a5f3fc; min-width: 18px; text-align: center; }

.rack { padding: 12px 14px 40px; position: relative; }
.rack-rows { position: relative; display: flex; flex-direction: column; gap: 5px; width: max-content; min-width: 100%; }
.chan-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 9px;
  padding: 5px 10px; width: max-content; min-width: 100%;
}
.chan-row.selected { border-color: hsla(var(--hue), 80%, 60%, .8); box-shadow: 0 0 10px hsla(var(--hue), 80%, 60%, .12); }
.chan-left { display: flex; align-items: center; gap: 8px; width: 244px; flex: none; }
.chan-dot {
  width: 13px; height: 13px; border-radius: 50%; cursor: pointer; flex: none;
  background: hsl(var(--hue), 85%, 58%);
  box-shadow: 0 0 8px hsla(var(--hue), 85%, 60%, .8);
  transition: all .12s;
}
.chan-dot.muted { background: #333a46; box-shadow: none; }
.chan-dot.solo { outline: 2px solid var(--warn); outline-offset: 1px; }
.chan-name {
  font-size: 12.5px; font-weight: 600; cursor: pointer; flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chan-name:hover { color: hsl(var(--hue), 90%, 70%); }
.chan-knobs { display: flex; gap: 4px; flex: none; }

.chan-steps { display: flex; gap: 3px; align-items: center; position: relative; }
.step {
  width: 26px; height: 30px; border-radius: 5px; cursor: pointer; flex: none;
  background: #10141d; border: 1px solid #1d2431;
  transition: background .08s;
}
.step.alt { background: #0c1017; }
.step.beat { border-left-color: #33405a; }
.step:hover { border-color: hsl(var(--hue), 70%, 55%); }
.step.on {
  background: linear-gradient(180deg,
    hsla(var(--hue), 85%, 62%, calc(var(--vel, .8) * .95)),
    hsla(var(--hue), 85%, 45%, calc(var(--vel, .8) * .85)));
  border-color: hsl(var(--hue), 85%, 60%);
  box-shadow: 0 0 9px hsla(var(--hue), 85%, 60%, calc(var(--vel, .8) * .5));
}
.melodic-badge {
  position: absolute; right: 6px; top: -7px;
  background: hsla(var(--hue), 70%, 45%, .95); color: #fff;
  font-size: 8.5px; padding: 2px 7px; border-radius: 8px; cursor: pointer;
  font-weight: 700; letter-spacing: .3px;
}
.chan-add-row { padding: 6px 0; }
.rack-empty { text-align: center; padding: 70px 20px; }
.rack-empty-big { font-size: 17px; color: var(--dim); margin-bottom: 18px; }
.rack-posline {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: rgba(90,255,220,.85); box-shadow: 0 0 8px rgba(90,255,220,.7);
  pointer-events: none; z-index: 4;
}

/* ================= knobs ================= */
.knob-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; }
.knob {
  border-radius: 50%; cursor: ns-resize; position: relative;
  background: radial-gradient(circle at 35% 30%, #2a3342, #151a24 70%);
  border: 1.5px solid #2c3648;
  box-shadow: inset 0 2px 5px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.6);
}
.knob:hover { border-color: var(--acc); }
.knob-ind {
  position: absolute; left: 50%; top: 50%; width: 2.5px; height: 42%;
  background: linear-gradient(180deg, var(--acc), transparent);
  transform-origin: 50% 0%;
  transform: translate(-50%, 0) rotate(var(--rot, 0deg)) translateY(-100%);
  border-radius: 2px;
}
.knob-label { font-size: 7.5px; color: var(--dim); letter-spacing: 1px; font-weight: 700; }
.knob-tip {
  position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
  background: #000; color: #a5f3fc; font-size: 10.5px; font-family: monospace;
  padding: 3px 8px; border-radius: 5px; white-space: nowrap; z-index: 99;
  border: 1px solid var(--line); pointer-events: none;
}

/* ================= piano roll / playlist shared ================= */
.pr-toolbar {
  display: flex; align-items: center; gap: 9px; padding: 8px 14px;
  background: var(--panel2); border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.pr-canvas-wrap { flex: 1; position: relative; overflow: hidden; }
.pr-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.pr-chan {
  display: flex; align-items: center; gap: 7px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 11px; font-weight: 700; font-size: 12px;
}
.pr-chan:hover { border-color: var(--acc); }
.pr-chan-dot { width: 10px; height: 10px; border-radius: 50%; }
.pr-hint { font-size: 9.5px; color: var(--dim); margin-left: auto; max-width: 46%; line-height: 1.35; }

/* ================= mixer ================= */
.view-mixer { flex-direction: row !important; }
.mixer-strips {
  flex: 1; display: flex; gap: 8px; padding: 14px; overflow-x: auto; align-items: flex-start;
}
.mstrip {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 11px;
  padding: 10px 8px; width: 92px; flex: none;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  cursor: pointer; transition: border-color .12s;
}
.mstrip.selected { border-color: hsl(var(--hue, 186), 80%, 60%); box-shadow: 0 0 14px hsla(var(--hue, 186), 80%, 60%, .15); }
.mstrip.master { background: linear-gradient(180deg, #1a2030, #141924); width: 104px; }
.mstrip.master.selected { border-color: var(--acc2); }
.mstrip.bus { background: #10141f; width: 110px; }
.mstrip-name {
  font-size: 10.5px; font-weight: 800; letter-spacing: .5px; text-align: center;
  color: hsl(var(--hue, 200), 60%, 75%);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%;
}
.mstrip.master .mstrip-name { color: #d8b4fe; }
.mstrip-fader-row { display: flex; gap: 6px; align-items: stretch; }
.fader { position: relative; }
.fader-track {
  width: 12px; height: 120px; background: #0b0e15; border-radius: 7px;
  border: 1px solid var(--line); position: relative; cursor: ns-resize;
}
.fader-fill {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(180deg, var(--acc2), var(--acc));
  border-radius: 0 0 6px 6px; opacity: .5;
}
.fader-handle {
  position: absolute; left: -5px; right: -5px; height: 14px;
  background: linear-gradient(180deg, #3a4660, #232c3e);
  border: 1px solid #4a5a7a; border-radius: 4px;
  box-shadow: 0 2px 6px rgba(0,0,0,.6);
}
.mstrip-meter { border-radius: 4px; background: #0b0e15; border: 1px solid var(--line); }
.mstrip-ms { display: flex; gap: 5px; }
.ms-btn {
  width: 26px; height: 22px; border-radius: 5px; font-size: 10px; font-weight: 800;
  background: var(--panel); border: 1px solid var(--line); color: var(--dim); cursor: pointer;
}
.ms-btn.on-m { background: rgba(248,113,113,.25); border-color: var(--bad); color: var(--bad); }
.ms-btn.on-s { background: rgba(245,158,11,.25); border-color: var(--warn); color: var(--warn); }
.mstrip-sends { display: flex; gap: 6px; }
.mstrip-fx { display: flex; flex-direction: column; gap: 3px; width: 100%; }
.fx-chip {
  font-size: 9px; padding: 4px 6px; border-radius: 5px;
  background: var(--panel); border: 1px solid var(--line);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
  color: var(--text);
}
.fx-chip.off { opacity: .38; }
.fx-chip.selected { border-color: var(--acc); color: var(--acc); }
.bus-knobs { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
.bus-time { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.bus-time .gsel { max-width: 74px; font-size: 10px; padding: 3px 4px; }
.bus-desc { font-size: 8.5px; color: var(--dim); text-align: center; line-height: 1.4; }

/* fx panel */
.fx-panel {
  width: 308px; flex: none; background: var(--panel2); border-left: 1px solid var(--line);
  overflow-y: auto; padding: 14px;
}
.fx-panel-title { font-size: 13px; font-weight: 800; letter-spacing: .5px; margin-bottom: 12px; color: #a5f3fc; }
.fx-chain-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.fx-row {
  display: flex; align-items: center; gap: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 8px; cursor: pointer;
}
.fx-row.selected { border-color: var(--acc); }
.fx-row-name { flex: 1; font-size: 11.5px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.fx-on { background: none; border: none; color: #333c4c; font-size: 12px; cursor: pointer; padding: 0; }
.fx-on.lit { color: var(--good); text-shadow: 0 0 8px rgba(52,211,153,.8); }
.fx-add-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.fx-add-row .gsel { flex: 1; min-width: 130px; }
.fx-params {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
}
.fx-params-title { font-size: 12px; font-weight: 800; margin-bottom: 12px; color: #d8b4fe; }
.fx-params-grid { display: flex; flex-wrap: wrap; gap: 13px 15px; align-items: flex-start; }
.fx-param-sel { display: flex; flex-direction: column; gap: 4px; }
.fx-param-sel .gsel { max-width: 130px; }
.fx-empty { color: var(--dim); font-size: 12px; white-space: pre-line; line-height: 1.7; padding: 12px 4px; }

.gate-editor { width: 100%; }
.gate-cells { display: flex; gap: 3px; margin-top: 5px; flex-wrap: wrap; }
.gate-cell {
  width: 15px; height: 26px; border-radius: 3px; cursor: pointer;
  background: #10141d; border: 1px solid #232a38;
}
.gate-cell.beat { border-left-color: #3a466a; }
.gate-cell.on { background: linear-gradient(180deg, var(--acc2), #a21caf); border-color: var(--acc2); box-shadow: 0 0 7px rgba(232,121,249,.5); }

/* ================= library ================= */
.view-library { flex-direction: row !important; overflow: hidden; }
.lib-col { flex: 1; overflow-y: auto; padding: 16px; }
.lib-col + .lib-col { border-left: 1px solid var(--line); }
.lib-title { font-size: 14px; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; color: #a5f3fc; }
.lib-cats { display: flex; gap: 5px; margin: 12px 0; flex-wrap: wrap; }
.lib-cat {
  background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
  border-radius: 20px; padding: 5px 13px; font-size: 11px; font-weight: 700; cursor: pointer;
}
.lib-cat.active { color: #0b0e15; background: linear-gradient(135deg, var(--acc), var(--acc2)); border-color: transparent; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 9px; }
.lib-card {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 11px;
  padding: 13px 12px 11px; cursor: pointer; position: relative; transition: all .13s;
}
.lib-card:hover { border-color: var(--acc); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.lib-card-icon { font-size: 21px; margin-bottom: 7px; }
.lib-card-name { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
.lib-card-cat { font-size: 9px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
.lib-card-add {
  position: absolute; top: 9px; right: 9px;
  width: 26px; height: 26px; border-radius: 7px; border: 1px solid rgba(34,211,238,.5);
  background: rgba(34,211,238,.12); color: var(--acc); font-size: 15px; cursor: pointer;
}
.lib-card-add:hover { background: rgba(34,211,238,.3); }

.drop-zone {
  border: 2px dashed #2c3648; border-radius: 13px; padding: 22px;
  text-align: center; margin: 14px 0; transition: all .15s;
}
.drop-zone.over { border-color: var(--acc); background: rgba(34,211,238,.07); }
.drop-big { font-size: 14px; color: var(--dim); margin-bottom: 12px; }
.drop-btns { display: flex; gap: 8px; justify-content: center; }

.gb-help { margin: 6px 0 14px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; }
.gb-help summary { cursor: pointer; font-weight: 700; font-size: 12px; color: #fbbf24; }
.gb-help p, .gb-help ul { font-size: 11.5px; color: var(--text); line-height: 1.6; margin: 8px 0; }
.gb-help ul { padding-left: 18px; }
.gb-help code { background: #0b0e15; padding: 1px 6px; border-radius: 4px; font-size: 10.5px; color: #a5f3fc; user-select: text; -webkit-user-select: text; }

.sample-list { display: flex; flex-direction: column; gap: 4px; }
.sample-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px;
}
.sample-name { flex: 1; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sample-dur { font-size: 10px; color: var(--dim); font-family: monospace; }

/* ================= onscreen keyboard ================= */
#kbd-wrap { background: #0c0f16; border-top: 1px solid var(--line); overflow-x: auto; }
#kbd { position: relative; height: 96px; margin: 8px auto; }
#kbd.hidden { display: none; }
.pkey { position: absolute; top: 0; cursor: pointer; }
.pkey.white {
  width: 24px; height: 92px; background: linear-gradient(180deg, #e8edf4, #c9d3e0);
  border: 1px solid #98a5b8; border-radius: 0 0 5px 5px; z-index: 1;
}
.pkey.black {
  width: 16px; height: 56px; background: linear-gradient(180deg, #2a3342, #10141d);
  border: 1px solid #000; border-radius: 0 0 4px 4px; z-index: 2;
}
.pkey.white.down { background: linear-gradient(180deg, #67e8f9, #22d3ee); }
.pkey.black.down { background: linear-gradient(180deg, #e879f9, #a21caf); }
.pkey-label { position: absolute; bottom: 4px; left: 4px; font-size: 8px; color: #4a5568; pointer-events: none; }

/* ================= menus / modals / toasts ================= */
.ctx-menu {
  position: fixed; z-index: 1000; min-width: 190px;
  background: #161b26; border: 1px solid #2c3648; border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0,0,0,.6); padding: 5px;
}
.ctx-item { padding: 8px 12px; border-radius: 7px; cursor: pointer; font-size: 12.5px; }
.ctx-item:hover { background: rgba(34,211,238,.12); }
.ctx-item.danger { color: var(--bad); }
.ctx-item.danger:hover { background: rgba(248,113,113,.12); }
.ctx-item.disabled { opacity: .4; cursor: default; }
.ctx-sep { height: 1px; background: var(--line); margin: 5px 8px; }

.modal-ov {
  position: fixed; inset: 0; z-index: 900;
  background: rgba(4,6,10,.72); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
}
.modal {
  background: #131826; border: 1px solid #2c3648; border-radius: 15px;
  min-width: 360px; max-width: 92vw; max-height: 88vh; overflow: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,.7);
}
.modal.wide { min-width: 720px; }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px 10px;
}
.modal-title { font-size: 15px; font-weight: 800; }
.modal-body { padding: 6px 18px 18px; }

.auto-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.auto-canvas { width: 100%; border-radius: 10px; border: 1px solid var(--line); cursor: crosshair; touch-action: none; }

.help-cols { display: flex; gap: 26px; }
.help-cols > div { flex: 1; }
.help-cols h3 { font-size: 13px; color: #a5f3fc; margin: 12px 0 8px; }
.help-cols ol { padding-left: 20px; font-size: 12.5px; line-height: 1.9; }
.help-keys { border-collapse: collapse; font-size: 12px; }
.help-keys td { padding: 4px 10px 4px 0; }
.help-keys td:first-child { color: var(--acc); font-family: monospace; white-space: nowrap; }

#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 1200; display: flex; flex-direction: column; gap: 7px; align-items: center; }
.toast {
  background: #161b26; border: 1px solid rgba(34,211,238,.4); color: var(--text);
  border-radius: 10px; padding: 10px 18px; font-size: 12.5px;
  box-shadow: 0 8px 30px rgba(0,0,0,.55), 0 0 20px rgba(34,211,238,.12);
  animation: toast-in .25s ease; max-width: 74vw; text-align: center;
}
.toast.err { border-color: rgba(248,113,113,.55); }
.toast.out { opacity: 0; transform: translateY(8px); transition: all .4s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }

/* scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #0c0f16; }
::-webkit-scrollbar-thumb { background: #262f40; border-radius: 6px; border: 2px solid #0c0f16; }
::-webkit-scrollbar-thumb:hover { background: #33405a; }

</style>
</head>
<body>

  <div id="app">
    <header id="topbar"></header>
    <nav id="tabs"></nav>
    <main id="main"></main>
    <footer id="kbd-wrap">
      <div id="kbd" class="hidden"></div>
    </footer>
  </div>
  <div id="toasts"></div>
<script>
/* ============================================================
   GENENGINE — util.js
   Shared helpers, DOM builders, knobs, faders, menus, toasts.
   ============================================================ */
'use strict';
window.G = window.G || {};

(function (G) {

  // ---------- misc ----------
  G.PPQ = 96;                    // ticks per quarter note
  G.BAR = G.PPQ * 4;             // 384 ticks per 4/4 bar
  G.STEP = G.PPQ / 4;            // 24 ticks per 1/16 step

  G.clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  G.lerp = (a, b, t) => a + (b - a) * t;
  G.uid = () => 'id' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  G.deepCopy = (o) => JSON.parse(JSON.stringify(o));

  G.NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  G.noteName = (midi) => G.NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1);
  G.isBlackKey = (midi) => [1, 3, 6, 8, 10].includes(midi % 12);
  G.midiToFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);

  // Snap grid values in ticks (label → ticks)
  G.SNAPS = [
    ['Bar', 384], ['1/2', 192], ['1/3', 128], ['1/4', 96], ['1/6', 64],
    ['1/8', 48], ['1/12', 32], ['1/16', 24], ['1/24', 16], ['1/32', 12],
    ['1/48', 8], ['1/64', 6], ['None', 1],
  ];

  G.fmtTime = (ticks, bpm) => {
    const bar = Math.floor(ticks / G.BAR) + 1;
    const beat = Math.floor((ticks % G.BAR) / G.PPQ) + 1;
    const step = Math.floor((ticks % G.PPQ) / G.STEP) + 1;
    return `${String(bar).padStart(3, '0')}:${beat}:${step}`;
  };

  G.channelHues = [186, 320, 265, 24, 145, 45, 205, 350, 90, 285, 12, 165, 226, 55, 305, 130];
  G.hueFor = (i) => G.channelHues[i % G.channelHues.length];

  // ---------- pub/sub ----------
  const listeners = {};
  G.on = (evt, fn) => { (listeners[evt] = listeners[evt] || []).push(fn); };
  G.emit = (evt, data) => { (listeners[evt] || []).forEach(fn => { try { fn(data); } catch (e) { console.error('[emit ' + evt + ']', e); } }); };

  // ---------- DOM ----------
  G.el = (tag, cls, parent, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  G.qs = (sel, root) => (root || document).querySelector(sel);
  G.qsa = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  G.toast = (msg, kind) => {
    const host = G.qs('#toasts') || (() => { const h = G.el('div', '', document.body); h.id = 'toasts'; return h; })();
    const t = G.el('div', 'toast ' + (kind || ''), host, msg);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, 2600);
  };

  // ---------- generic drag helper ----------
  // opts: {onStart(e), onMove(dx,dy,e), onEnd(e), cursor}
  G.drag = (el, opts) => {
    el.addEventListener('pointerdown', (e) => {
      if (opts.button !== undefined && e.button !== opts.button) return;
      e.preventDefault(); e.stopPropagation();
      const sx = e.clientX, sy = e.clientY;
      let moved = false;
      const prevCursor = document.body.style.cursor;
      if (opts.cursor) document.body.style.cursor = opts.cursor;
      if (opts.onStart && opts.onStart(e) === false) { document.body.style.cursor = prevCursor; return; }
      const mv = (ev) => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
        opts.onMove && opts.onMove(dx, dy, ev);
      };
      const up = (ev) => {
        window.removeEventListener('pointermove', mv);
        window.removeEventListener('pointerup', up);
        document.body.style.cursor = prevCursor;
        opts.onEnd && opts.onEnd(ev, moved);
      };
      window.addEventListener('pointermove', mv);
      window.addEventListener('pointerup', up);
    });
  };

  // ---------- knob widget ----------
  // opts: {min, max, value, def, label, unit, fmt(v), curve('lin'|'exp'), size, onInput(v), onEnd(v)}
  G.knob = (opts) => {
    const size = opts.size || 38;
    const wrap = G.el('div', 'knob-wrap');
    const kn = G.el('div', 'knob', wrap);
    kn.style.width = kn.style.height = size + 'px';
    const ind = G.el('div', 'knob-ind', kn);
    const lbl = G.el('div', 'knob-label', wrap, opts.label || '');
    const min = opts.min, max = opts.max;
    let value = opts.value !== undefined ? opts.value : (opts.def !== undefined ? opts.def : min);

    const toNorm = (v) => {
      if (opts.curve === 'exp' && min > 0) return Math.log(v / min) / Math.log(max / min);
      return (v - min) / (max - min);
    };
    const fromNorm = (n) => {
      n = G.clamp(n, 0, 1);
      if (opts.curve === 'exp' && min > 0) return min * Math.pow(max / min, n);
      return min + (max - min) * n;
    };
    const fmt = opts.fmt || ((v) => (Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2)) + (opts.unit || ''));

    const render = () => {
      const n = toNorm(value);
      kn.style.setProperty('--rot', (-135 + n * 270) + 'deg');
      kn.title = (opts.label ? opts.label + ': ' : '') + fmt(value);
    };

    let startVal;
    G.drag(kn, {
      cursor: 'ns-resize',
      onStart: () => { startVal = toNorm(value); showVal(); },
      onMove: (dx, dy, e) => {
        const fine = e.shiftKey ? 0.15 : 1;
        value = fromNorm(startVal - dy / 160 * fine);
        render(); showVal();
        opts.onInput && opts.onInput(value);
      },
      onEnd: () => { hideVal(); opts.onEnd && opts.onEnd(value); },
    });
    kn.addEventListener('dblclick', () => {
      value = opts.def !== undefined ? opts.def : (min + max) / 2;
      render(); opts.onInput && opts.onInput(value); opts.onEnd && opts.onEnd(value);
    });
    kn.addEventListener('wheel', (e) => {
      e.preventDefault();
      value = fromNorm(toNorm(value) + (e.deltaY < 0 ? 0.03 : -0.03));
      render(); opts.onInput && opts.onInput(value); clearTimeout(kn._wt);
      kn._wt = setTimeout(() => opts.onEnd && opts.onEnd(value), 300);
    }, { passive: false });

    let valTip = null;
    const showVal = () => {
      if (!valTip) valTip = G.el('div', 'knob-tip', wrap);
      valTip.textContent = fmt(value);
    };
    const hideVal = () => { if (valTip) { valTip.remove(); valTip = null; } };

    render();
    wrap.setValue = (v, silent) => { value = G.clamp(v, min, max); render(); if (!silent) opts.onInput && opts.onInput(value); };
    wrap.getValue = () => value;
    return wrap;
  };

  // ---------- select builder ----------
  G.select = (options, value, onChange, cls) => {
    const s = G.el('select', 'gsel ' + (cls || ''));
    options.forEach(o => {
      const [val, label] = Array.isArray(o) ? o : [o, o];
      const op = G.el('option', '', s, label);
      op.value = val;
    });
    s.value = value;
    s.addEventListener('change', () => onChange(s.value));
    return s;
  };

  // ---------- context menu ----------
  let menuEl = null;
  G.closeMenu = () => { if (menuEl) { menuEl.remove(); menuEl = null; } };
  // items: [{label, action, danger, sep, disabled}]
  G.menu = (x, y, items) => {
    G.closeMenu();
    menuEl = G.el('div', 'ctx-menu', document.body);
    items.forEach(it => {
      if (it.sep) { G.el('div', 'ctx-sep', menuEl); return; }
      const b = G.el('div', 'ctx-item' + (it.danger ? ' danger' : '') + (it.disabled ? ' disabled' : ''), menuEl, it.label);
      if (!it.disabled) b.addEventListener('click', () => { G.closeMenu(); it.action && it.action(); });
    });
    document.body.appendChild(menuEl);
    const r = menuEl.getBoundingClientRect();
    menuEl.style.left = Math.min(x, window.innerWidth - r.width - 8) + 'px';
    menuEl.style.top = Math.min(y, window.innerHeight - r.height - 8) + 'px';
    setTimeout(() => {
      const close = (e) => { if (!menuEl || !menuEl.contains(e.target)) { G.closeMenu(); window.removeEventListener('pointerdown', close); } };
      window.addEventListener('pointerdown', close);
    }, 0);
  };

  // ---------- modal ----------
  G.modal = (title, buildFn, opts) => {
    const ov = G.el('div', 'modal-ov', document.body);
    const box = G.el('div', 'modal ' + ((opts && opts.cls) || ''), ov);
    const head = G.el('div', 'modal-head', box);
    G.el('div', 'modal-title', head, title);
    const closeBtn = G.el('button', 'icon-btn', head, '✕');
    const body = G.el('div', 'modal-body', box);
    const close = () => { ov.remove(); opts && opts.onClose && opts.onClose(); };
    closeBtn.addEventListener('click', close);
    ov.addEventListener('pointerdown', (e) => { if (e.target === ov) close(); });
    buildFn(body, close);
    return { close, body, box };
  };

  // ---------- WAV encoding ----------
  G.encodeWav = (buffers /* [L,R] Float32Array */, sampleRate) => {
    const numCh = buffers.length, len = buffers[0].length;
    const bytesPerSample = 2, blockAlign = numCh * bytesPerSample;
    const buf = new ArrayBuffer(44 + len * blockAlign);
    const view = new DataView(buf);
    const wstr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
    wstr(0, 'RIFF'); view.setUint32(4, 36 + len * blockAlign, true); wstr(8, 'WAVE');
    wstr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
    view.setUint16(22, numCh, true); view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true); view.setUint16(32, blockAlign, true);
    view.setUint16(34, 16, true); wstr(36, 'data'); view.setUint32(40, len * blockAlign, true);
    let off = 44;
    for (let i = 0; i < len; i++) {
      for (let ch = 0; ch < numCh; ch++) {
        let s = Math.max(-1, Math.min(1, buffers[ch][i]));
        view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        off += 2;
      }
    }
    return new Blob([buf], { type: 'audio/wav' });
  };

  G.download = (blob, name) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };

})(window.G);


/* ============================================================
   GENENGINE — state.js
   Project data model, selection, undo/redo, save/load.

   Timing: 96 ticks per quarter (PPQ). Bar = 384 ticks.
   Note: { t: startTick, d: durTicks, p: midiPitch, v: vel 0..1, s: slide? }
   ============================================================ */
'use strict';
(function (G) {

  // ---------- factories ----------
  G.newChannel = (opts) => Object.assign({
    id: G.uid(),
    name: 'Channel',
    kind: 'synth',            // 'synth' | 'drum' | 'sampler'
    synth: G.deepCopy(G.DEFAULT_SYNTH),
    drum: { type: 'kick' },   // used when kind === 'drum'
    sample: null,             // { name, base64?, buffer(runtime) } when kind === 'sampler'
    samp: { root: 60, start: 0, end: 1, loop: false, attack: 0.001, release: 0.08, gain: 1 },
    vol: 0.8, pan: 0, mute: false, solo: false,
    pitch: 0,                 // semitones, automatable, drives all voices
    fx: [],                   // [{id, type, on, params:{}}]
    sendA: 0, sendB: 0,       // reverb / delay send levels
    hue: 186,
  }, opts || {});

  G.DEFAULT_SYNTH = {
    engine: 'super',          // 'super'|'acid'|'fm'|'pluck'|'sub'|'noise'
    wave: 'sawtooth', unison: 5, detune: 18, spread: 0.8,
    sub: 0.25, noise: 0,
    attack: 0.005, decay: 0.25, sustain: 0.6, release: 0.3,
    cutoff: 4500, res: 1.2, fenv: 2400, fattack: 0.002, fdecay: 0.3,
    glide: 0, fmRatio: 2, fmAmt: 300, fmDecay: 0.4,
    gain: 0.8,
  };

  G.newPattern = (name, bars) => ({
    id: G.uid(),
    name: name || 'Pattern',
    bars: bars || 1,          // length in bars
    notes: {},                // channelId -> [Note]
    hue: G.hueFor(Math.floor(Math.random() * 16)),
  });

  G.newProject = () => ({
    fmt: 1,
    name: 'Untitled Flight',
    bpm: 138, swing: 0,
    masterVol: 0.85,
    masterFx: [],
    sendAFx: { size: 3.2, decay: 3.5, tone: 5200, mix: 1 },   // global space reverb
    sendBFx: { time: '3/16', feedback: 0.42, tone: 3800, mix: 1 }, // global sync delay
    channels: [],
    patterns: [G.newPattern('Pattern 1')],
    playlist: { tracks: Array.from({ length: 12 }, (_, i) => ({ name: 'Track ' + (i + 1), clips: [] })) },
    // clip: {id, type:'pat'|'auto', patId?, autoId?, t: startTick, d: durTicks}
    automations: [],          // {id, name, target:{ch, param}, points:[{t (0..1 of clip), v (0..1)}]}
    loop: { on: true, a: 0, b: G.BAR * 8 },
  });

  // ---------- current state ----------
  G.proj = null;
  G.sel = {
    patternId: null,          // current pattern (channel rack / piano roll)
    channelId: null,          // current channel (piano roll / keyboard target)
    tab: 'steps',
  };

  G.curPattern = () => G.proj.patterns.find(p => p.id === G.sel.patternId) || G.proj.patterns[0];
  G.curChannel = () => G.proj.channels.find(c => c.id === G.sel.channelId) || G.proj.channels[0];
  G.chanById = (id) => G.proj.channels.find(c => c.id === id);
  G.patById = (id) => G.proj.patterns.find(p => p.id === id);
  G.autoById = (id) => G.proj.automations.find(a => a.id === id);
  G.notesFor = (pat, chanId) => (pat.notes[chanId] = pat.notes[chanId] || []);

  // Length of pattern in ticks (auto-grows with content)
  G.patTicks = (pat) => pat.bars * G.BAR;
  G.patAutoGrow = (pat) => {
    let maxT = 0;
    Object.values(pat.notes).forEach(arr => arr.forEach(n => { maxT = Math.max(maxT, n.t + n.d); }));
    const need = Math.max(1, Math.ceil(maxT / G.BAR));
    if (need > pat.bars) pat.bars = need;
  };

  G.songTicks = () => {
    let max = G.BAR * 4;
    G.proj.playlist.tracks.forEach(tr => tr.clips.forEach(c => { max = Math.max(max, c.t + c.d); }));
    return max;
  };

  // ---------- mutations ----------
  G.addChannel = (opts, skipUndo) => {
    if (!skipUndo) G.undoPush('Add channel');
    const ch = G.newChannel(opts);
    ch.hue = G.hueFor(G.proj.channels.length);
    G.proj.channels.push(ch);
    G.sel.channelId = ch.id;
    G.emit('channels');
    return ch;
  };

  G.removeChannel = (id) => {
    G.undoPush('Delete channel');
    const i = G.proj.channels.findIndex(c => c.id === id);
    if (i >= 0) G.proj.channels.splice(i, 1);
    G.proj.patterns.forEach(p => delete p.notes[id]);
    if (G.sel.channelId === id) G.sel.channelId = G.proj.channels[0] && G.proj.channels[0].id;
    G.audio && G.audio.dropChannelGraph(id);
    G.emit('channels'); G.emit('notes');
  };

  G.addPattern = (name) => {
    G.undoPush('Add pattern');
    const p = G.newPattern(name || 'Pattern ' + (G.proj.patterns.length + 1));
    G.proj.patterns.push(p);
    G.sel.patternId = p.id;
    G.emit('patterns');
    return p;
  };

  G.clonePattern = (id) => {
    G.undoPush('Clone pattern');
    const src = G.patById(id); if (!src) return;
    const p = G.deepCopy(src); p.id = G.uid(); p.name = src.name + ' copy';
    G.proj.patterns.push(p); G.sel.patternId = p.id;
    G.emit('patterns');
    return p;
  };

  G.removePattern = (id) => {
    if (G.proj.patterns.length <= 1) { G.toast('Cannot delete the last pattern'); return; }
    G.undoPush('Delete pattern');
    G.proj.patterns = G.proj.patterns.filter(p => p.id !== id);
    G.proj.playlist.tracks.forEach(tr => { tr.clips = tr.clips.filter(c => c.patId !== id); });
    if (G.sel.patternId === id) G.sel.patternId = G.proj.patterns[0].id;
    G.emit('patterns'); G.emit('playlist');
  };

  // ---------- undo ----------
  const undoStack = [], redoStack = [];
  const snapshot = () => JSON.stringify(G.serialize(false));
  G.undoPush = (label) => {
    undoStack.push({ label, data: snapshot() });
    if (undoStack.length > 80) undoStack.shift();
    redoStack.length = 0;
  };
  // capture/commit pair for drag gestures: capture BEFORE mutating,
  // commit at gesture end only if something actually changed
  G.undoCapture = () => snapshot();
  G.undoCommit = (label, data) => {
    if (data === snapshot()) return;
    undoStack.push({ label, data });
    if (undoStack.length > 80) undoStack.shift();
    redoStack.length = 0;
  };
  const restore = (data) => {
    const keepSamples = {};
    G.proj.channels.forEach(c => { if (c.sample && c.sample.buffer) keepSamples[c.id] = c.sample; });
    G.loadProjectData(JSON.parse(data), keepSamples);
  };
  G.undo = () => {
    if (!undoStack.length) { G.toast('Nothing to undo'); return; }
    redoStack.push({ label: 'redo', data: snapshot() });
    restore(undoStack.pop().data);
    G.toast('Undo');
  };
  G.redo = () => {
    if (!redoStack.length) { G.toast('Nothing to redo'); return; }
    undoStack.push({ label: 'undo', data: snapshot() });
    restore(redoStack.pop().data);
    G.toast('Redo');
  };

  // ---------- serialize / load ----------
  G.serialize = (includeSamples) => {
    const p = JSON.parse(JSON.stringify(G.proj, (k, v) => (k === 'buffer' ? undefined : v)));
    if (!includeSamples) p.channels.forEach(c => { if (c.sample) c.sample = { name: c.sample.name }; });
    return p;
  };

  G.loadProjectData = (data, keepSamples) => {
    G.proj = data;
    // re-attach runtime sample buffers where possible
    G.proj.channels.forEach(c => {
      if (keepSamples && keepSamples[c.id]) c.sample = keepSamples[c.id];
      else if (c.sample && c.sample.name && G.library) {
        const buf = G.library.bufferByName(c.sample.name);
        if (buf) c.sample.buffer = buf;
      }
    });
    if (!G.patById(G.sel.patternId)) G.sel.patternId = G.proj.patterns[0] && G.proj.patterns[0].id;
    if (!G.chanById(G.sel.channelId)) G.sel.channelId = G.proj.channels[0] && G.proj.channels[0].id;
    G.audio && G.audio.rebuildAll();
    G.emit('project'); G.emit('channels'); G.emit('patterns'); G.emit('notes'); G.emit('playlist'); G.emit('mixer');
  };

  // ---------- save / open ----------
  G.saveProjectFile = async () => {
    const data = G.serialize(true);
    // embed sample audio as base64 wav so projects are portable
    for (const c of G.proj.channels) {
      if (c.kind === 'sampler' && c.sample && c.sample.buffer && !c.sample.base64) {
        try {
          const b = c.sample.buffer;
          const chans = [b.getChannelData(0), b.numberOfChannels > 1 ? b.getChannelData(1) : b.getChannelData(0)];
          const blob = G.encodeWav(chans, b.sampleRate);
          const b64 = await blobToB64(blob);
          const dc = data.channels.find(x => x.id === c.id);
          if (dc) dc.sample = { name: c.sample.name, base64: b64 };
        } catch (e) { console.warn('sample embed failed', e); }
      }
    }
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    G.download(blob, (G.proj.name || 'project').replace(/[^\w\- ]+/g, '') + '.genengine.json');
    G.toast('Project saved 💾');
  };

  const blobToB64 = (blob) => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });

  G.openProjectFile = (file) => {
    const r = new FileReader();
    r.onload = async () => {
      try {
        const data = JSON.parse(r.result);
        if (!data.channels || !data.patterns) throw new Error('Not a GenEngine project');
        // decode embedded samples
        for (const c of data.channels) {
          if (c.sample && c.sample.base64) {
            try {
              const bin = atob(c.sample.base64);
              const arr = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
              await G.audio.init();
              c.sample.buffer = await G.audio.ctx.decodeAudioData(arr.buffer);
              delete c.sample.base64;
            } catch (e) { console.warn('sample decode failed', e); }
          }
        }
        G.transport && G.transport.stop();
        G.loadProjectData(data);
        G.toast('Project loaded: ' + (data.name || 'Untitled'));
      } catch (e) { console.error(e); G.toast('Could not open project: ' + e.message, 'err'); }
    };
    r.readAsText(file);
  };

  // ---------- autosave ----------
  G.autosave = () => {
    try { localStorage.setItem('genengine.autosave', JSON.stringify(G.serialize(false))); } catch (e) { /* quota */ }
  };
  G.loadAutosave = () => {
    try {
      const s = localStorage.getItem('genengine.autosave');
      if (!s) return false;
      G.loadProjectData(JSON.parse(s));
      return true;
    } catch (e) { return false; }
  };

})(window.G);

  def('filter', {

    name: 'Distortion', icon: '🔥',

  def('crush', {

    name: 'Space Chamber', icon: '✧',

  def('comp', {
    name: 'Compressor', icon: '◫',

  // ================= SIDECHAIN PUMP (DUCK) =================
  def('duck', {
    name: 'Sidechain Pump', icon: '💓',
    tempo: true, scheduled: true,
    params: {
      amount: P('Amount', 0, 1, 0.8),
      rate: P('Rate', 0, 0, '1/4', { type: 'select', options: [['1/4', '1/4 (four on floor)'], ['1/8', '1/8 (double time)'], ['1/2', '1/2 (half time)']] }),
      release: P('Recover', 0.05, 0.6, 0.24, { unit: 's' }),
      hold: P('Hold', 0, 0.15, 0.02, { unit: 's' }),
    },
    build(ctx) {
      const gn = ctx.createGain();
      return {
        in: gn, out: gn,
        set() {},
        onBar(barTime, bpm, p) {

            g.linearRampToValueAtTime(1, Math.min(t + 0.004 + p.hold + p.release, t + per));

  def('gate', {
    name: 'Trance Gate', icon: '▚',

      depth: P('Depth', 0, 1, 1),
      smooth: P('Smooth', 0.001, 0.05, 0.008, { fmt: v => (v * 1000).toFixed(0) + 'ms' }),
      rate: P('Rate', 0, 0, '1/16', { type: 'select', options: [['1/8', '1/8'], ['1/16', '1/16'], ['1/32', '1/32']] }),
    },
    build(ctx) {
      const gn = ctx.createGain();
      return {
        in: gn, out: gn,
        set() {},
        onBar(barTime, bpm, p) {
          const beat = 60 / bpm;
          const stepDur = p.rate === '1/8' ? beat / 2 : p.rate === '1/32' ? beat / 8 : beat / 4;
          const steps = Math.round(4 * beat / stepDur);

    },

  // REALTIME ENGINE
  // ======================================================
  A.strips = new Map();

  // SCHEDULING CORE (shared by realtime + offline export)
  // ======================================================

  const collectSongEvents = (proj, a, b, emitNote, emitAutoSeg) => {

    if (!T.playing || T.mode !== 'pat') {
      G.sel.patternId = id; G.emit('patterns'); G.emit('notes');
      return;
    }
    if (id === G.sel.patternId) return;
    T.queuedPattern = id;
    G.emit('patterns');
  };

  // ======================================================
  // OFFLINE EXPORT
  // ======================================================
  A.exportWav = async (scope) => {
    await A.init();
    const proj = G.proj;
    const spt = 60 / (proj.bpm * G.PPQ);

/* ============================================================
   GENENGINE — steps.js
   Channel Rack + Step Sequencer (FL Studio style).
   Click steps to place hits; drag vertically on a lit step to
   shape velocity; melodic channels open the Piano Roll.
   ============================================================ */
'use strict';
(function (G) {

  const V = G.views = G.views || {};
  let root = null, stepsScroller = null, posLine = null;

  const stepW = 26, stepGap = 3;

  const render = () => {
    if (!root) return;
    const proj = G.proj;
    const pat = G.curPattern();
    if (!pat) return;
    root.innerHTML = '';

    // ---------- pattern bar ----------
    const patBar = G.el('div', 'pat-bar', root);
    G.el('span', 'pat-label', patBar, 'PATTERNS');
    const chips = G.el('div', 'pat-chips', patBar);
    proj.patterns.forEach((p, i) => {
      const chip = G.el('div', 'pat-chip' + (p.id === pat.id ? ' active' : '') + (G.transport.queuedPattern === p.id ? ' queued' : ''), chips);
      chip.style.setProperty('--hue', p.hue);
      G.el('span', 'pat-chip-num', chip, String(i + 1));
      G.el('span', '', chip, p.name);
      chip.title = 'Click: select / queue live · Right-click: menu · Keys 1-9 switch';
      chip.addEventListener('click', () => { G.transport.queuePattern(p.id); });
      chip.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        G.menu(e.clientX, e.clientY, [
          { label: '✏️ Rename', action: () => renamePattern(p) },
          { label: '⧉ Clone', action: () => G.clonePattern(p.id) },
          { label: '＋ Add bar', action: () => { G.undoPush('Pattern length'); p.bars++; G.emit('notes'); } },
          { label: '－ Remove bar', action: () => { if (p.bars > 1) { G.undoPush('Pattern length'); p.bars--; G.emit('notes'); } } },
          { sep: true },
          { label: '🗑 Delete', danger: true, action: () => G.removePattern(p.id) },
        ]);
      });
    });
    const addPat = G.el('button', 'pat-add', patBar, '＋');
    addPat.title = 'New pattern';
    addPat.addEventListener('click', () => G.addPattern());

    const lenWrap = G.el('div', 'pat-len', patBar);
    G.el('span', 'dim', lenWrap, 'BARS');
    const minus = G.el('button', 'mini-btn', lenWrap, '–');
    G.el('span', 'pat-len-num', lenWrap, String(pat.bars));
    const plus = G.el('button', 'mini-btn', lenWrap, '+');
    minus.addEventListener('click', () => { if (pat.bars > 1) { G.undoPush('Pattern length'); pat.bars--; G.emit('notes'); } });
    plus.addEventListener('click', () => { if (pat.bars < 16) { G.undoPush('Pattern length'); pat.bars++; G.emit('notes'); } });

    // ---------- rack ----------
    const rack = G.el('div', 'rack', root);
    const totalSteps = pat.bars * 16;

    if (!proj.channels.length) {
      const empty = G.el('div', 'rack-empty', rack);

      name.addEventListener('dblclick', () => { G.sel.channelId = chan.id; G.setTab('piano'); });

        grabOfs: xToTick(x) - hit.clip.t,
        origT: hit.clip.t,
      };
      return;
    }

    // paint new clip
    const ti = yToTrack(y);
    if (ti < 0 || ti >= tracks().length) return;
    ensureBrush();
    if (!brush.id) return;
    G.undoPush('Paint clip');
    const t = doSnap(xToTick(x));
    const clip = brush.type === 'pat'
      ? { id: G.uid(), type: 'pat', patId: brush.id, t, d: brushLen() }
      : { id: G.uid(), type: 'auto', autoId: brush.id, t, d: brushLen() };

      case 'pan':

        scrollY = Math.max(0, scrollY - e.movementY);

        break;
      case 'seek':
        seekTo(doSnap(xToTick(x)));
        break;
      case 'loop': {

          out.push({ v: JSON.stringify({ ch: ch.id, param: 'fx:' + f.id + ':res' }), l: ch.name + ' · Filter Reso' });

        a.points.sort((x2, y2) => x2.t - y2.t);
        redraw(); invalidate();
      });
      cv.addEventListener('pointerup', () => { dragPt = null; });
      cv.addEventListener('contextmenu', ev => ev.preventDefault());

      G.el('div', 'dim small', body, 'Click to add points · drag to shape · right-click removes · the clip stretches this curve over its length');
      const delBtn = G.el('button', 'btn danger-btn', body, '🗑 Delete automation');
      delBtn.addEventListener('click', () => {
        G.undoPush('Delete automation');
        G.proj.automations = G.proj.automations.filter(x2 => x2.id !== a.id);
        tracks().forEach(tr => tr.clips = tr.clips.filter(cl => cl.autoId !== a.id));
        close(); buildToolbar(); invalidate();
      });
      redraw();
    }, { cls: 'wide' });

  // ---------- toolbar ----------
  const buildToolbar = () => {
    if (!toolbar) return;
    ensureBrush();
    toolbar.innerHTML = '';
    G.el('span', 'dim', toolbar, 'BRUSH');
    const opts = [];
    G.proj.patterns.forEach(p => opts.push(['pat:' + p.id, '▦ ' + p.name]));

    const newAutoBtn = G.el('button', 'btn subtle', toolbar, '＋ Automation');
    newAutoBtn.addEventListener('click', newAutomation);

    G.el('span', 'dim pad-l', toolbar, 'SNAP');
    toolbar.appendChild(G.select([[String(G.BAR), 'Bar'], [String(G.PPQ), 'Beat'], [String(G.STEP), '1/16']], String(snapTicks), v => snapTicks = parseInt(v, 10)));

    G.el('span', 'dim', toolbar, 'zoom');
    const zoomIn = G.el('button', 'mini-btn', toolbar, '+');
    zoomOut.addEventListener('click', () => { ppt = Math.max(0.03, ppt / 1.3); invalidate(); });
    zoomIn.addEventListener('click', () => { ppt = Math.min(1.2, ppt * 1.3); invalidate(); });

    G.el('span', 'pr-hint', toolbar, 'Paint clips with the brush · drag to move · right-click erases · double-click opens · click ruler seeks · shift-drag ruler sets loop');
  };

  // ---------- mount ----------
  V.playlist = Object.assign(V.playlist, {
    _seek: null,
    mount(el) {
      root = el;
      root.innerHTML = '';
      toolbar = G.el('div', 'pr-toolbar', root);
      const cwrap = G.el('div', 'pr-canvas-wrap', root);
      canvas = G.el('canvas', 'pr-canvas', cwrap);
      ctx2d = canvas.getContext('2d');
      dpr = window.devicePixelRatio || 1;
      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerup', onPointerUp);
      canvas.addEventListener('dblclick', onDblClick);
      canvas.addEventListener('contextmenu', e => e.preventDefault());
      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.ctrlKey || e.metaKey) {
          const r = canvas.getBoundingClientRect();
          const mx = e.clientX - r.left;
          const tickAt = xToTick(mx);
          ppt = G.clamp(ppt * (e.deltaY < 0 ? 1.12 : 0.89), 0.03, 1.2);
          scrollX = Math.max(0, tickAt * ppt - (mx - HEAD_W));
        } else if (e.shiftKey) {
          scrollX = Math.max(0, scrollX + (e.deltaY + e.deltaX) * 0.9);
        } else {
          scrollY = Math.max(0, scrollY + e.deltaY * 0.5);
        }
        invalidate();
      }, { passive: false });
      buildToolbar();
      invalidate();
    },
    refresh() { buildToolbar(); invalidate(); },
    tick() { if (G.transport.playing || needsDraw) draw(); },
    invalidate,
    getSeek() { return V.playlist._seek; },
  });

  V.song = V.playlist;   // tab id alias

  ['patterns', 'playlist', 'channels', 'project'].forEach(evt => G.on(evt, () => { if (G.sel.tab === 'song') { buildToolbar(); invalidate(); } }));

})(window.G);

  const curFxOwnerName = () => fxSel.scope === 'master' ? 'MASTER' : (G.curChannel() ? G.curChannel().name : '—');
  const applyFxUpdate = (fx) => {
    if (fxSel.scope === 'master') G.audio.updateMasterFx(fx);
    else G.audio.updateFx(G.curChannel(), fx);
  };
  const rebuildOwner = () => {
    if (fxSel.scope === 'master') G.audio.rebuildAll();
    else G.audio.rebuildStrip(G.curChannel());
  };

  const renderFxPanel = () => {
    fxPanel.innerHTML = '';
    const head = G.el('div', 'fx-panel-head', fxPanel);
    G.el('div', 'fx-panel-title', head, '⛓ FX — ' + curFxOwnerName());

    const arr = curFxArr();

    // chain list
    const list = G.el('div', 'fx-chain-list', fxPanel);
    arr.forEach((fx, i) => {
      const d = G.fx.defs[fx.type];
      const row = G.el('div', 'fx-row' + (fxSel.fxId === fx.id ? ' selected' : ''), list);
      const onBtn = G.el('button', 'fx-on' + (fx.on ? ' lit' : ''), row, '●');
      onBtn.title = 'Bypass';
      onBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        G.undoPush('Toggle FX'); fx.on = !fx.on; rebuildOwner(); renderFxPanel(); render();
      });
      G.el('span', 'fx-row-name', row, (d ? d.icon + ' ' + d.name : fx.type));
      const up = G.el('button', 'mini-btn', row, '▲');
      const dn = G.el('button', 'mini-btn', row, '▼');
      const del = G.el('button', 'mini-btn danger', row, '✕');
      up.addEventListener('click', (e) => { e.stopPropagation(); if (i > 0) { G.undoPush('Reorder FX'); arr.splice(i, 1); arr.splice(i - 1, 0, fx); rebuildOwner(); render(); } });
      dn.addEventListener('click', (e) => { e.stopPropagation(); if (i < arr.length - 1) { G.undoPush('Reorder FX'); arr.splice(i, 1); arr.splice(i + 1, 0, fx); rebuildOwner(); render(); } });
      del.addEventListener('click', (e) => { e.stopPropagation(); G.undoPush('Remove FX'); arr.splice(i, 1); if (fxSel.fxId === fx.id) fxSel.fxId = null; rebuildOwner(); render(); });
      row.addEventListener('click', () => { fxSel.fxId = fx.id; renderFxPanel(); });
    });

    // add fx / chain presets
    const addRow = G.el('div', 'fx-add-row', fxPanel);
    const addSel = G.select([['', '＋ Add effect…'], ...Object.keys(G.fx.defs).map(t => [t, G.fx.defs[t].icon + ' ' + G.fx.defs[t].name])], '', (v) => {
      if (!v) return;
      G.undoPush('Add FX');
      const fx = G.fx.newFx(v);
      arr.push(fx); fxSel.fxId = fx.id;
      rebuildOwner(); render();
    });
    addRow.appendChild(addSel);
    const chainSel = G.select([['', '⛓ Chain preset…'], ...G.presets.fxChains.map(c => [c.name, c.name])], '', (v) => {
      if (!v) return;
      const preset = G.presets.fxChains.find(c => c.name === v);
      if (!preset) return;
      G.undoPush('FX chain preset');
      preset.fx.forEach(([type, params]) => {
        const fx = G.fx.newFx(type);
        Object.assign(fx.params, params || {});
        arr.push(fx);
      });
      rebuildOwner(); render();
    });
    addRow.appendChild(chainSel);

    // selected fx params
    const fx = arr.find(f => f.id === fxSel.fxId) || arr[0];
    if (!fx) {
      G.el('div', 'fx-empty', fxPanel, 'No effects yet.\nAdd a flanger, phaser, crusher, trance gate, sidechain pump…');
      return;
    }
    fxSel.fxId = fx.id;
    const d = G.fx.defs[fx.type];
    const pbox = G.el('div', 'fx-params', fxPanel);
    G.el('div', 'fx-params-title', pbox, d.icon + ' ' + d.name);
    const grid = G.el('div', 'fx-params-grid', pbox);

    Object.keys(d.params).forEach(key => {
      const pd = d.params[key];
      if (pd.type === 'select') {
        const wrap = G.el('div', 'fx-param-sel', grid);
        G.el('div', 'knob-label', wrap, pd.label);
        wrap.appendChild(G.select(pd.options, fx.params[key], v => {
          G.undoPush('FX param'); fx.params[key] = v; applyFxUpdate(fx);
        }));
      } else if (pd.type === 'gatePattern') {
        const wrap = G.el('div', 'gate-editor', grid);
        G.el('div', 'knob-label', wrap, 'PATTERN — click steps');
        const cells = G.el('div', 'gate-cells', wrap);
        const pat = (fx.params[key] || '1111111111111111').padEnd(16, '0').slice(0, 16).split('');
        pat.forEach((bit, i) => {
          const cell = G.el('div', 'gate-cell' + (bit === '1' ? ' on' : '') + (i % 4 === 0 ? ' beat' : ''), cells);
          cell.addEventListener('pointerdown', () => {
            pat[i] = pat[i] === '1' ? '0' : '1';
            fx.params[key] = pat.join('');
            cell.classList.toggle('on');
            applyFxUpdate(fx);
          });
        });
      } else {
        grid.appendChild(G.knob({
          label: pd.label, min: pd.min, max: pd.max, def: pd.def,
          value: fx.params[key], size: 34, unit: pd.unit, curve: pd.curve, fmt: pd.fmt,
          onInput: v => { fx.params[key] = v; applyFxUpdate(fx); },
          onEnd: v => { fx.params[key] = v; applyFxUpdate(fx); },
        }));
      }
    });
  };

  // ---------------- meters ----------------
  const meterLoop = () => {
    if (G.sel.tab !== 'mixer' || !root || !root.isConnected) { meterRAF = null; return; }
    G.qsa('.mstrip-meter', root).forEach(cv => {
      const c = cv.getContext('2d');
      c.clearRect(0, 0, cv.width, cv.height);
      let level = 0;
      if (G.audio.ctx) {
        let analyser = null;
        if (cv._master) analyser = G.audio.masterAnalyser;
        else { const s = G.audio.strips.get(cv._chanId); analyser = s && s.analyser; }
        if (analyser) {
          const buf = new Float32Array(analyser.fftSize);
          analyser.getFloatTimeDomainData(buf);
          for (let i = 0; i < buf.length; i++) level = Math.max(level, Math.abs(buf[i]));
        }
      }
      cv._smooth = Math.max(level, (cv._smooth || 0) * 0.86);
      const h = Math.min(1, cv._smooth) * cv.height;
      const grad = c.createLinearGradient(0, cv.height, 0, 0);
      grad.addColorStop(0, '#22d3ee'); grad.addColorStop(0.7, '#a3e635'); grad.addColorStop(0.92, '#f59e0b'); grad.addColorStop(1, '#f87171');
      c.fillStyle = grad;
      c.fillRect(0, cv.height - h, cv.width, h);
    });
    meterRAF = requestAnimationFrame(meterLoop);
  };

  V.mixer = {
    mount(el) { root = el; render(); if (!meterRAF) meterRAF = requestAnimationFrame(meterLoop); },
    refresh: render,
    tick() {},
  };

  ['channels', 'mixer', 'project'].forEach(evt => G.on(evt, () => { if (G.sel.tab === 'mixer') render(); }));

})(window.G);


/* ============================================================
   GENENGINE — library.js
   Sound library: built-in instrument presets (audition & add)
   plus the user sample library — drag & drop your GarageBand /
   Apple Loops audio, stored persistently in IndexedDB.
   ============================================================ */
'use strict';
(function (G) {

  const V = G.views = G.views || {};
  const L = G.library = {};

  let root, sampleListEl, catFilter = 'All';
  let db = null;
  const decoded = new Map();     // name -> AudioBuffer
  let names = [];                // sample names in library
  let previewSrc = null;

  // ---------------- IndexedDB ----------------
  const openDB = () => new Promise((res) => {
    try {
      const req = indexedDB.open('genengine', 1);
      req.onupgradeneeded = () => { req.result.createObjectStore('samples', { keyPath: 'name' }); };
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
    } catch (e) { res(null); }
  });

  const idbPut = (rec) => new Promise((res) => {
    if (!db) return res(false);
    const tx = db.transaction('samples', 'readwrite');
    tx.objectStore('samples').put(rec);
    tx.oncomplete = () => res(true); tx.onerror = () => res(false);
  });
  const idbDel = (name) => new Promise((res) => {
    if (!db) return res(false);
    const tx = db.transaction('samples', 'readwrite');
    tx.objectStore('samples').delete(name);
    tx.oncomplete = () => res(true); tx.onerror = () => res(false);
  });
  const idbGet = (name) => new Promise((res) => {
    if (!db) return res(null);
    const tx = db.transaction('samples', 'readonly');
    const rq = tx.objectStore('samples').get(name);
    rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null);
  });
  const idbKeys = () => new Promise((res) => {
    if (!db) return res([]);
    const tx = db.transaction('samples', 'readonly');
    const rq = tx.objectStore('samples').getAllKeys();
    rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]);
  });

  L.init = async () => {
    db = await openDB();
    names = (await idbKeys()).sort();
  };

  L.bufferByName = (name) => decoded.get(name) || null;

  L.linkAsync = async (chan) => {
    if (!chan.sample || chan.sample.buffer || !chan.sample.name) return;
    const buf = await L.decode(chan.sample.name);
    if (buf) { chan.sample.buffer = buf; G.emit('channels'); }
  };

  L.decode = async (name) => {
    if (decoded.has(name)) return decoded.get(name);
    const rec = await idbGet(name);
    if (!rec) return null;
    try {
      await G.audio.init();
      const buf = await G.audio.ctx.decodeAudioData(rec.data.slice(0));
      decoded.set(name, buf);
      return buf;
    } catch (e) {
      console.warn('decode failed', name, e);
      return null;
    }
  };

  const AUDIO_EXT = /\.(wav|mp3|m4a|aac|ogg|oga|flac|aif|aiff|caf)$/i;

  L.addFiles = async (files) => {
    await G.audio.init();
    let ok = 0, fail = 0, failNames = [];
    for (const f of files) {
      if (!AUDIO_EXT.test(f.name)) continue;
      try {
        const data = await f.arrayBuffer();
        let buf = null;
        try { buf = await G.audio.ctx.decodeAudioData(data.slice(0)); }
        catch (e) { fail++; failNames.push(f.name); continue; }
        decoded.set(f.name, buf);
        await idbPut({ name: f.name, data, added: Date.now() });
        if (!names.includes(f.name)) names.push(f.name);
        ok++;
      } catch (e) { fail++; failNames.push(f.name); }
    }
    names.sort();
    renderSamples();
    if (ok) G.toast(`🎵 Imported ${ok} sample${ok > 1 ? 's' : ''} into your library`);
    if (fail) G.toast(`⚠ ${fail} file(s) couldn't be decoded by this browser (${failNames.slice(0, 2).join(', ')}${fail > 2 ? '…' : ''}). Safari decodes .caf/.aif natively — or convert with tools/convert_apple_loops.sh`, 'err');
  };

  // ---------------- UI ----------------
  const render = () => {
    if (!root) return;
    root.innerHTML = '';

    // ===== instruments =====
    const instCol = G.el('div', 'lib-col', root);
    G.el('div', 'lib-title', instCol, '🎛 INSTRUMENT LIBRARY');
    G.el('div', 'dim small', instCol, 'Click a card to hear it · ＋ adds it to your channel rack');

    const cats = G.el('div', 'lib-cats', instCol);
    ['All', ...G.presets.categories].forEach(cat => {
      const b = G.el('button', 'lib-cat' + (catFilter === cat ? ' active' : ''), cats, cat);
      b.addEventListener('click', () => { catFilter = cat; render(); });
    });

    const grid = G.el('div', 'lib-grid', instCol);
    G.presets.instruments
      .filter(p => catFilter === 'All' || p.cat === catFilter)
      .forEach(p => {
        const card = G.el('div', 'lib-card', grid);
        G.el('div', 'lib-card-icon', card, p.icon);
        G.el('div', 'lib-card-name', card, p.name);
        G.el('div', 'lib-card-cat', card, p.cat);
        const addB = G.el('button', 'lib-card-add', card, '＋');
        addB.title = 'Add to channel rack';
        card.addEventListener('click', async () => {
          await G.audio.init();
          const tmp = G.presets.makeChannel(p);
          G.audio.previewPreset(tmp, p.pitch, p.cat === 'Pad' || p.cat === 'FX' ? 1.4 : 0.5);
        });
        addB.addEventListener('click', async (e) => {
          e.stopPropagation();
          await G.audio.init();
          const c = G.presets.makeChannel(p);
          G.undoPush('Add channel');
          c.hue = G.hueFor(G.proj.channels.length);
          G.proj.channels.push(c);
          G.sel.channelId = c.id;
          G.emit('channels');
          G.toast('＋ ' + p.name + ' added to rack');
        });
      });

    // ===== samples =====
    const sampCol = G.el('div', 'lib-col', root);
    G.el('div', 'lib-title', sampCol, '📦 YOUR SAMPLE LIBRARY');
    G.el('div', 'dim small', sampCol, 'GarageBand sounds, Apple Loops, WAV / MP3 / M4A / AIFF — stored in your browser');

    const drop = G.el('div', 'drop-zone', sampCol);
    G.el('div', 'drop-big', drop, '⬇ Drag audio files or folders here');
    const btnRow = G.el('div', 'drop-btns', drop);
    const fileBtn = G.el('button', 'btn subtle', btnRow, 'Choose files…');
    const dirBtn = G.el('button', 'btn subtle', btnRow, 'Import folder…');
    const fileInp = G.el('input', '', drop); fileInp.type = 'file'; fileInp.multiple = true; fileInp.accept = 'audio/*,.wav,.mp3,.m4a,.aif,.aiff,.caf,.ogg,.flac'; fileInp.style.display = 'none';
    const dirInp = G.el('input', '', drop); dirInp.type = 'file'; dirInp.multiple = true; dirInp.webkitdirectory = true; dirInp.style.display = 'none';
    fileBtn.addEventListener('click', () => fileInp.click());
    dirBtn.addEventListener('click', () => dirInp.click());
    fileInp.addEventListener('change', () => L.addFiles([...fileInp.files]));
    dirInp.addEventListener('change', () => L.addFiles([...dirInp.files]));
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', async (e) => {
      e.preventDefault(); drop.classList.remove('over');
      const files = [];
      const walk = async (entry, depth) => {
        if (depth > 6) return;
        if (entry.isFile) {
          await new Promise(res => entry.file(f => { files.push(f); res(); }, res));
        } else if (entry.isDirectory) {
          const rd = entry.createReader();
          await new Promise(res => {
            const readAll = () => rd.readEntries(async (es) => {
              if (!es.length) return res();
              for (const en of es) await walk(en, depth + 1);
              readAll();
            }, res);
            readAll();
          });
        }
      };
      if (e.dataTransfer.items && e.dataTransfer.items[0] && e.dataTransfer.items[0].webkitGetAsEntry) {
        for (const item of [...e.dataTransfer.items]) {
          const en = item.webkitGetAsEntry();
          if (en) await walk(en, 0);
        }
      } else {
        files.push(...e.dataTransfer.files);
      }
      L.addFiles(files);
    });

    const gbHelp = G.el('details', 'gb-help', sampCol);
    G.el('summary', '', gbHelp, '🍎 Where are my GarageBand sounds?');
    const gbBody = G.el('div', '', gbHelp);
    gbBody.innerHTML = `
      <p>GarageBand scatters its sounds across several places on your Mac — including inside the app itself.
      Open Finder, press <b>⌘⇧G</b> and paste any of:</p>
      <ul>
        <li><code>/Applications/GarageBand.app/Contents</code> — inside the app bundle (right-click GarageBand → Show Package Contents)</li>
        <li><code>/Library/Audio/Apple Loops/Apple</code> — the big Apple Loops collection</li>
        <li><code>/Library/Application Support/GarageBand</code> — the Instrument Library (sampler one-shots, drum kits)</li>
        <li><code>/Library/Application Support/Logic</code> — shared sound content</li>
        <li><code>~/Library/Audio/Apple Loops/User Loops</code> — loops you saved yourself</li>
      </ul>
      <p>Drag files or whole folders into the drop zone above. <b>Safari decodes .caf and .aif natively.</b></p>
      <p>Easiest of all: <b>double-click “Harvest GarageBand Sounds.command”</b> (next to this app — first time:
      right-click it → Open → Open). It scans <b>all</b> of those locations automatically, converts everything
      to WAV, and opens the result — <code>~/Desktop/Music GenEngine/GarageBand Sounds</code> — in Finder.
      Then use “Import folder…” above and pick that folder.</p>`;

    sampleListEl = G.el('div', 'sample-list', sampCol);
    renderSamples();
  };

  const renderSamples = async () => {
    if (!sampleListEl) return;
    sampleListEl.innerHTML = '';
    if (!names.length) {
      G.el('div', 'fx-empty', sampleListEl, 'No samples yet — drop some in!');
      return;
    }
    names.forEach(name => {
      const row = G.el('div', 'sample-row', sampleListEl);
      const play = G.el('button', 'mini-btn play', row, '▶');
      const nm = G.el('span', 'sample-name', row, name);
      const buf = decoded.get(name);
      if (buf) G.el('span', 'sample-dur', row, buf.duration.toFixed(2) + 's');
      const add = G.el('button', 'mini-btn', row, '＋ rack');
      const del = G.el('button', 'mini-btn danger', row, '✕');
      play.addEventListener('click', async () => {
        await G.audio.init();
        if (previewSrc) { try { previewSrc.stop(); } catch (e) {} previewSrc = null; }
        const b = await L.decode(name);
        if (b) previewSrc = G.audio.previewBuffer(b);
        else G.toast('Could not decode ' + name, 'err');
      });
      add.addEventListener('click', async () => {
        await G.audio.init();
        const b = await L.decode(name);
        if (!b) { G.toast('Could not decode ' + name, 'err'); return; }
        G.undoPush('Add sampler');
        const c = G.newChannel({ kind: 'sampler', name: name.replace(/\.[^.]+$/, '').slice(0, 22) });
        c.sample = { name, buffer: b };
        c.hue = G.hueFor(G.proj.channels.length);
        G.proj.channels.push(c);
        G.sel.channelId = c.id;
        G.emit('channels');
        G.toast('＋ Sampler channel: ' + c.name);
      });
      del.addEventListener('click', async () => {
        await idbDel(name);
        decoded.delete(name);
        names = names.filter(n => n !== name);
        renderSamples();
      });
    });
  };

  V.library = {
    mount(el) { root = el; render(); },
    refresh: render,
    tick() {},
  };

})(window.G);
